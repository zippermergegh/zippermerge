[project]
name = "zippermerge"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zippermerge", email = "zippermerge12@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[tool.maturin]
module-name = "zippermerge._core"
python-packages = ["zippermerge"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[tool.uv.workspace]
members = [
    "packages/differential",
    "packages/matrix",
    "packages/distributions",
    "packages/model"
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
]
